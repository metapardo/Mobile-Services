      tags: [packages]
      summary: Create a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackageRequest"
      responses:
        "201":
          description: Package created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResult"
        "400":
          description: Invalid request body.
          content:
