          type: number
        totalCurrentAssets:
          type: number
        vehicleNet:
          type: number
        equipmentNet:
          type: number
        totalAssets:
          type: number
        accountsPayable:
          type: number
        vehicleLoanBalance:
          type: number
        totalLiabilities:
          type: number
        ownersEquity:
          type: number
      required:
        - asOf
        - cash
        - accountsReceivable
        - prepaidExpenses
        - totalCurrentAssets
        - vehicleNet
        - equipmentNet
        - totalAssets
        - accountsPayable
        - vehicleLoanBalance
        - totalLiabilities
        - ownersEquity
    FinancialReportCashFlow:
      type: object
      description: >-
        `netIncome`/`changeReceivables` are real (the latter is this period's real
        accounts receivable minus the previous equivalent period's); `depreciation`,
        `changePayables`, `loanPayments`, and `cashEnding` are fixed-formula/constant,
        ported verbatim from `reporting-data.ts`'s `getCashFlow`. `ownerDraws` is a
        fixed percentage (~55%) applied to the now-real `netIncome`.
