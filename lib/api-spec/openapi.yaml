  /bookings/anchors:
    get:
      operationId: listBookingAnchors
      tags: [bookings]
      summary: Nearby active, future bookings pre-filtered by straight-line distance (FR-19)
      description: >-
        PRD_Mobull_Appointment_Optimizer_v1.0.md FR-19/§5 Step 1 — candidate "anchor"
        bookings for the scheduling-assist recommendation engine. Returns active
        (not `cancelled`/`no-show`) bookings within `[today, today + days]` that have
        real coordinates (`latitude`/`longitude` both non-null — a legacy booking with
        no coordinates is excluded entirely here, never treated as distance zero, per
        the PRD §10 edge case table), pre-filtered server-side to within a 30-mile
        straight-line (Haversine) distance of `(lat, lng)` — computed directly in the
        SQL `WHERE` clause, not pulled into Node and filtered in memory, since the
        whole point of FR-19 is cutting the candidate list down before anything more
        expensive (a Route Matrix call) runs. Per FR-19: "Road distance is never
        shorter than straight-line, so a 30-mile cut-off cannot produce a false
        negative" — this can over-include (a candidate that's actually >45 min by
        road despite being <30mi straight-line) but never wrongly exclude a true
        anchor, which is exactly the property the caller's later 45-minute Route
        Matrix filter needs.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
          description: Latitude of the new appointment's address.
        - name: lng
          in: query
          required: true
          schema:
            type: number
          description: Longitude of the new appointment's address.
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
          description: >-
            Search window in days from today, inclusive. Defaults to 7
            (FR-22 — the search window is a Phase 2 business setting; this endpoint
            hardcodes the same default today rather than waiting on that setting).
      responses:
        "200":
          description: >-
            Anchor candidates within the window and straight-line radius, ordered by
            date then start time. May be an empty array (no error) when nothing
            qualifies — PRD §10 "No booking within 45 min anywhere in the window".
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnchorCandidate"
        "400":
          description: Invalid/missing lat, lng, or days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
