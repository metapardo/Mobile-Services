        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      description: >-
        Hard delete (unlike clients/packages/employees) — nothing else references a
        booking except its own `booking_packages`/`employee_splits` rows, which cascade.
        Prefer `PATCH /bookings/{id}` with `status: cancelled` for a normal
        cancellation; this is for genuine removal.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Booking deleted.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings/{id}/payment:
    post:
      operationId: recordBookingPayment
      tags: [bookings]
      summary: Record how a booking was paid
      description: >-
        PRD_DetailHub_Payment_Methods.md FR-1/FR-2/FR-5. Selecting `zelle`/`venmo`/
        `cash` marks the booking paid via that method, timestamps it
        (`paymentRecordedAt`), and stores an optional free-text `paymentReference`.
        Selecting `credit_card` ALWAYS fails with 422 `card_processing_not_available`
        — no payment processor is connected in this codebase; this never charges a
        card, real or simulated.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBookingPaymentRequest"
      responses:
        "200":
          description: Booking updated with the recorded payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            `paymentMethod` was `credit_card`, which isn't available yet — no payment
            processor is connected (FR-5). Never charges a card, real or simulated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings/{id}/refund:
    post:
      operationId: refundBooking
      tags: [bookings]
      summary: Record a refund against a booking
      description: >-
        FR-8/Section 6.2 of PRD_DetailHub_Payment_Methods.md. Always a manual reversal
        record — sets `refundStatus: completed` and stores an optional free-text
        `refundReference`. Never calls a real processor refund API for any tender
        type; the money movement (if any) happens outside the app, same as the
        original Zelle/Venmo/Cash payment itself.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundBookingRequest"
      responses:
        "200":
          description: Booking updated with the recorded refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/financials:
    get:
      operationId: getFinancialReport
      tags: [reports]
      summary: Full financial statement set for a period (Monthly/Quarterly/Annual Financial View)
      description: >-
        FR-10/FR-11/FR-13 of PRD_DetailHub_After_Package_Work.md Section 6.2. Computes
        an income statement (revenue -> COGS -> gross profit -> opex -> operating
        income -> interest/tax -> net income), a balance sheet, a cash flow statement,
        package mix, revenue-by-employee, and a trailing-6-calendar-month
        revenue/net-income trend (ending with the month containing `end`) for one
        `[start, end]` period. This is a deliberate hybrid: revenue, jobs, labor
        (real payroll gross for the period), package mix, revenue-by-employee, and
        accounts receivable are computed from real bookings/payroll/packages/
        employees data; fixed overhead, loan interest, depreciation, the illustrative
        25% tax rate, and every balance-sheet field without a real underlying ledger
        are ported verbatim as constants from the app's original mock financial model
        (`artifacts/detail-hub/src/lib/reporting-data.ts`) — see
        `calculateFinancialReport` in `@workspace/db` for the exact breakdown. Every
        ratio is guarded against a zero-revenue/zero-jobs period (FR-13): `0`, never
        `NaN`/`Infinity`.
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The computed financial report for the requested period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReportResult"
        "400":
          description: Invalid request (missing/malformed start or end, or start after end).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/autocomplete:
    post:
      operationId: autocompletePlaces
      tags: [maps]
      summary: Address suggestions from Google Places API (New) Autocomplete
      description: >-
        PRD_Mobull_Fuel_Gauge_Accuracy_Rework.md FR-9 through FR-13, FR-19. Server-side
        proxy to Places API (New) `places:autocomplete` — `GOOGLE_MAPS_API_KEY` never
        reaches the browser (Section 9.1). Always restricted to `regionCode: "US"`
        (FR-12). When `originLat`/`originLng` are supplied (the organization's Home
        Base coordinates, once the frontend has them), results are biased with a
        `locationBias` circle around that point; Google's `Circle.radius` maximum is
        50,000m (~31 mi), so the PRD's 50-mile bias radius is clamped to that API
        ceiling rather than sent as-is. Omitted entirely — not an error — when no
        origin is supplied, since Home Base coordinates don't exist in the DB yet.
        Only `placePrediction` suggestions are returned (each carries a `placeId`);
        Google's other suggestion type, `queryPrediction`, has no `placeId` and can't
        be selected as a booking address, so it's filtered out server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutocompletePlacesRequest"
      responses:
        "200":
          description: Suggestion list, ordered by Google's relevance ranking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocompletePlacesResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            Places API (New) Autocomplete request failed or returned an unexpected
            shape. The frontend should degrade the field to plain text (FR-19), never
            block the form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/details:
    post:
      operationId: getPlaceDetails
      tags: [maps]
      summary: Resolve a selected suggestion to coordinates via Place Details (New)
      description: >-
        FR-14. Requests exactly `location,formattedAddress` via the required
        `X-Goog-FieldMask` header — Google bills Place Details by field mask breadth,
        so no other field (photos, reviews, hours, etc.) is requested. Passing the
        same `sessionToken` used for the preceding `/places/autocomplete` calls closes
        that Autocomplete billing session (FR-11); this is implicit in the call itself
        — there is no separate "end session" request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPlaceDetailsRequest"
      responses:
        "200":
          description: Resolved coordinates and formatted address for the selected place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetailsResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Google has no place matching this placeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Place Details (New) request failed or returned an unexpected shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /routes/compute:
    post:
      operationId: computeRoute
      tags: [maps]
      summary: Traffic-aware one-way drive distance and drive time between two places
      description: >-
        FR-1 through FR-6. Server-side proxy to Routes API `computeRoutes` with
        `travelMode: DRIVE`, `routingPreference: TRAFFIC_AWARE`, and the given
        `departureTime` — the actual drive at the actual hour of the appointment
        (FR-3). Returns a ONE-WAY distance/time; callers (the Fuel Gauge calculation
        layer) double it themselves for the round trip per PRD §6.1. Never fabricates
        a distance (FR-5): if Google returns `routes: []` (no routable path — e.g.
        islands, remote sites), this responds `422 no_route_found` rather than a fake
        number, so the frontend can show Unknown with a retry instead of a guess.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRouteRequest"
      responses:
        "200":
          description: One-way distance and drive time for the requested departure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeRouteResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Google returned no route between these two places (FR-5) — never a
            fabricated distance; the frontend must show Unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Routes API request failed or returned an unexpected shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /routes/matrix:
    post:
      operationId: computeRouteMatrix
      tags: [maps]
      summary: Traffic-aware one-way drive distance/time from one origin to many destinations
      description: >-
        PRD_Mobull_Appointment_Optimizer_v1.0.md FR-18a/FR-20 — the anchor-ranking
        batch sibling of `POST /routes/compute`: one Route Matrix element batch per
        search (1 origin x N destinations), never N separate `/routes/compute` calls
        in a loop, which would bill the same elements, add N round trips of latency,
        and trip the per-organization rate limiter (FR-21a).

        STUB — Phase 1 of this PRD explicitly does not implement the real Google
        Route Matrix v2 call (`../integrations/google-maps.ts`'s `computeRouteMatrix`
        always throws `NotImplementedError`, mapped to `501` below); that integration
        is a later pass's job. This endpoint exists now so the contract, validation,
        and error-mapping shape are settled ahead of that work — it must never
        respond `200` with a fabricated or estimated distance in the meantime.

        Once implemented, a per-destination Google failure (PRD §10 "Route Matrix
        partially fails -> drop failed candidates, rank the rest") must surface as
        that one element's `error` field in a `200` response, not as a whole-request
        failure — the contract already supports this via `RouteMatrixElementResult`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRouteMatrixRequest"
      responses:
        "200":
          description: >-
            One result per requested destination, in request order. Individual
            elements may have failed (see `RouteMatrixElementResult.error`) without
            the whole request failing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteMatrixElementResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: >-
            Not implemented yet — the real Google Route Matrix v2 integration is a
            later pass's job (see this operation's description).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Route Matrix request failed or returned an unexpected shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    EmployeeIdParam:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
    RoleIdParam:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignupRequest:
      type: object
      description: >-
        Body for the fully self-serve admin/owner signup endpoint. Creates one user
        and one brand-new organization together — no invite token.
      properties:
        name:
          type: string
          minLength: 1
          description: The admin/owner user's display name.
        email:
          type: string
          format: email
          description: The admin/owner user's login email.
        password:
          type: string
          minLength: 8
          description: The admin/owner user's password (min length matches Better Auth's default).
        organizationName:
          type: string
          minLength: 1
          description: Display name of the new organization.
        organizationSlug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: URL-safe unique slug for the new organization (lowercase, hyphen-separated).
        businessAddress:
          type: string
          minLength: 1
          description: >-
            The business's home base address, required at signup
            (`PRD_DetailHub_SelfServe_Signup_Trial.md` FR-3/FR-11). Stored verbatim as
            `settings.homeAddress` for the new organization — not geocoded at signup
            time (FR-12); a future geocoding job is out of scope here.
      required:
        - name
        - email
        - password
        - organizationName
        - organizationSlug
        - businessAddress
    AuthUser:
      type: object
      description: >-
        The authenticated admin/owner user, as returned by every auth endpoint that
        includes a user (signup, login, session-check) — one shape shared across all
        three so the frontend has a single `AuthUser` type to work with.
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - emailVerified
        - createdAt
    SignupOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - createdAt
    SignupResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        organization:
          $ref: "#/components/schemas/SignupOrganization"
        token:
          type: string
          description: >-
            The raw session token, for non-cookie clients — mirrors
            `LoginResult.token`. Present because signup now also signs the caller in
            (see this operation's description).
        organizationId:
          type: string
          description: >-
            The newly-created organization's id, set as this session's active
            organization. Unlike `LoginResult.organizationId`, this is never `null` —
            signup always activates the organization it just created.
      required:
        - user
        - organization
        - token
        - organizationId
    LoginRequest:
      type: object
      description: Body for admin/owner sign-in.
      properties:
        email:
          type: string
          format: email
          description: The admin/owner user's login email.
        password:
          type: string
          minLength: 1
          description: The admin/owner user's password.
      required:
        - email
        - password
    LoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        token:
          type: string
          description: >-
            The raw session token, for non-cookie clients (bearer-token auth). Browser
            clients don't need this — the session cookie is set on the response
            automatically and is what the browser actually uses.
        organizationId:
          type: string
          nullable: true
          description: >-
            The organization automatically set as this session's active organization
            (see the `/auth/login` description for when that happens), or `null` if it
            wasn't — mirrors `SessionResult.organizationId` so the frontend doesn't have
            to make a separate `GET /auth/session` call immediately after login just to
            learn this.
      required:
        - user
        - token
        - organizationId
    SessionResult:
      type: object
      description: >-
        Discriminated on `authenticated`: when `false`, `user`/`organizationId` are
        absent (not merely null) — the frontend should check `authenticated` first.
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
        organizationId:
          type: string
          nullable: true
          description: >-
            Only present when `authenticated` is true. `null` means the session is
            valid but has no active organization set (see `/auth/session`'s
            description for when this can happen) — distinct from `authenticated:
            false`, which means there's no valid session at all.
      required:
        - authenticated
    LogoutResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    SettingsResult:
      type: object
      description: >-
        Per-organization settings — one row per organization, created automatically at
        signup. Field names/shape match `artifacts/detail-hub/src/lib/mock-data.ts`'s
        `Settings` interface (see `PRD_MobileDetailingApp.md` Section 3.2's Gas Meter
        feature for what most of these beyond `homeAddress` are used for).
      properties:
        homeAddress:
          type: string
          description: >-
            The business's home base address (`AdminSettings.home_base_address` in the
            master PRD). Editable via `PATCH /settings`.
        hqLatitude:
          type: number
          nullable: true
          description: >-
            PRD_Mobull_Fuel_Gauge_Accuracy_Rework.md FR-2/FR-24/§9.4 (Phase 1). Null
            until Home Base is re-saved through the Places-autocomplete address field
            — an org that hasn't done that yet gets Unknown gauge readings and a setup
            prompt (frontend concern, next phase), not a fabricated location.
        hqLongitude:
          type: number
          nullable: true
        hqGooglePlaceId:
          type: string
          nullable: true
        gasPrice:
          type: number
          description: Assumed $/gallon fuel price, for Gas Meter cost estimates.
        vehicleMpg:
          type: number
          description: Assumed vehicle fuel economy, for Gas Meter cost estimates.
        gasThresholdGreen:
          type: number
          description: Gas Meter "green" cost-ratio threshold (percent).
        gasThresholdAmber:
          type: number
          description: Gas Meter "amber" cost-ratio threshold (percent).
        commissionRate:
          type: number
          description: Default employee commission rate (percent), used by Payroll.
        fuelGaugeHalfMi:
          type: number
          description: Fuel Gauge "half" band lower bound, $/mile.
        fuelGaugeFullMi:
          type: number
          description: Fuel Gauge "full" band lower bound, $/mile.
        fuelGaugeHalfMin:
          type: number
          description: Fuel Gauge "half" band lower bound, $/minute.
        fuelGaugeFullMin:
          type: number
          description: Fuel Gauge "full" band lower bound, $/minute.
        techHourlyCost:
          type: number
          description: >-
            PRD_Mobull_Fuel_Gauge_Accuracy_Rework.md §6.1/§6.2 (Phase 1). What an hour
            of a technician's time costs the business — priced into the Fuel Gauge's
            drive-time cost line. NOT NULL at the DB level with a $22.00 default, so
            this is always present (unlike the nullable HQ coordinate fields above).
        paymentProcessorConnected:
          type: boolean
        cardReaderPaired:
          type: boolean
      required:
        - homeAddress
        - gasPrice
        - vehicleMpg
        - gasThresholdGreen
        - gasThresholdAmber
        - commissionRate
        - fuelGaugeHalfMi
        - fuelGaugeFullMi
        - fuelGaugeHalfMin
        - fuelGaugeFullMin
        - techHourlyCost
        - paymentProcessorConnected
        - cardReaderPaired
    UpdateSettingsRequest:
      type: object
      description: >-
        Partial update to the current organization's settings. All fields optional —
        omitted fields are left unchanged. Same field set as `SettingsResult`.
      properties:
        homeAddress:
          type: string
          minLength: 1
        hqLatitude:
          type: number
        hqLongitude:
          type: number
        hqGooglePlaceId:
          type: string
        gasPrice:
          type: number
        vehicleMpg:
          type: number
        gasThresholdGreen:
          type: number
        gasThresholdAmber:
          type: number
        commissionRate:
          type: number
        fuelGaugeHalfMi:
          type: number
        fuelGaugeFullMi:
          type: number
        fuelGaugeHalfMin:
          type: number
        fuelGaugeFullMin:
          type: number
        techHourlyCost:
          type: number
          minimum: 0
        paymentProcessorConnected:
          type: boolean
        cardReaderPaired:
          type: boolean
    ClientResult:
      type: object
      description: >-
        A customer/client record. Field names/shape match
        `artifacts/detail-hub/src/lib/mock-data.ts`'s `Client` interface, plus
        `archived`/`createdAt`/`updatedAt` (formalized here, not present on the mock
        interface).
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - archived
        - createdAt
        - updatedAt
    CreateClientRequest:
      type: object
      description: >-
        `email`/`address` are optional — quick-add (per
        `PRD_DetailHub_Appointment_Creation_Flow_Enhancement.md` FR-3/FR-4) only
        collects name + phone; email/address can be filled in later from the Clients
        page. When `email` IS provided it must still be a valid email address.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          minLength: 1
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
        - phone
    UpdateClientRequest:
      type: object
      description: Partial update — all fields optional.
      properties:
        name:
          type: string
          minLength: 1
        phone:
