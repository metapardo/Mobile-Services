  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List the current organization's employees
      description: >-
        Minimal employee records (`PRD_DetailHub_Real_Bookings_Clients_Backend.md`
        FR-2/FR-9) — just enough to assign a booking and show a name/color on the
        calendar. Excludes inactive (soft-deleted) employees by default — pass
        `includeInactive=true` to include them too.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The organization's employees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      description: >-
        Minimal create for v1 — `name`/`color` only, matching FR-9 ("create/update can
        be simple"). The full employee profile (worker type, pay rate, bank accounts)
        is a Payroll Module concern layered onto this same table later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /employees/{id}:
