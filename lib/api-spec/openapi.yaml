          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: archiveEmployee
      tags: [employees]
      summary: Archive (soft-delete) an employee
      description: >-
        Marks the employee inactive rather than removing the row, so any booking/
        employee-split that already references it keeps a valid `employeeId`. The
        archived employee no longer appears in `GET /employees` unless
        `includeInactive=true` is passed.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
