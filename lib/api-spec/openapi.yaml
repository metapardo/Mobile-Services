      description: "Only `status: paid` is accepted, and only from a `draft` run."
      properties:
        status:
          type: string
          enum: [paid]
      required:
        - status
    AnchorCandidate:
      type: object
      description: >-
        PRD_Mobull_Appointment_Optimizer_v1.0.md FR-19 — one row per anchor booking
        returned by `GET /bookings/anchors`: an active (not `cancelled`/`no-show`),
        future booking with real, non-null coordinates, already pre-filtered in SQL to
        within a 30-mile straight-line distance of the query point. Never includes a
        legacy booking with null `latitude`/`longitude` (PRD §10 — excluded, not
        treated as distance zero).
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
          description: "24-hour HH:MM, e.g. \"09:00\"."
        durationMinutes:
          type: integer
          description: >-
            Sum of `durationMinutes` across this booking's assigned packages (0 if
            none are assigned).
        employeeIds:
          type: array
          items:
            type: integer
          description: >-
            Every employee assigned to this booking (its `employee_splits` rows) —
            the technician(s) this anchor already belongs to (PRD §5 Step 2: "A
            technician is never checked against a teammate's anchor").
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        googlePlaceId:
          type: string
          nullable: true
      required:
        - id
        - date
        - startTime
        - durationMinutes
        - employeeIds
        - address
        - latitude
        - longitude
        - googlePlaceId
    BookingResult:
      type: object
      description: >-
        Field names/shape match `artifacts/detail-hub/src/lib/mock-data.ts`'s
        `Booking` interface (`date`, `startTime`, `address`, not the master PRD's
        `scheduledDate`/`scheduledStartTime`/`serviceAddress` — the mock interface is
        the source of truth per Section 7), plus `createdAt`/`updatedAt`/`createdBy`.
        `employeeIds` is derived from `employeeSplit` for convenience, not stored
        separately. (`gasMeterStatus`/`weatherSnapshot` were removed per FR-9 of
        PRD_DetailHub_Signup_Copy_and_Packages_Hardening.md — dead placeholder
        columns never populated by a real integration; FR-11 says they come back for
        real later, see Fuel_Gauge_PRD.md.) `paymentMethod`/`paymentReference`/
        `paymentRecordedAt`/`refundStatus`/`refundReference` match
        `PRD_DetailHub_Payment_Methods.md` Section 7 exactly (superseding the earlier,
        rougher `paymentMethod`/`paymentNote` shape this API had before that PRD was
        reviewed — see `../../lib/db/src/schema/bookings.ts` for why) — settable only
        via `POST /bookings/{id}/payment` and `POST /bookings/{id}/refund`, never
        through `POST`/`PATCH /bookings`.
      properties:
        id:
          type: integer
        clientId:
          type: integer
        packageIds:
          type: array
          items:
            type: integer
        employeeIds:
          type: array
          items:
            type: integer
          description: Derived from `employeeSplit` (every `employeeId` present in the split).
        employeeSplit:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSplit"
        date:
          type: string
          format: date
        startTime:
          type: string
          description: "24-hour HH:MM, e.g. \"09:00\"."
        address:
          type: string
        latitude:
          type: number
          nullable: true
          description: >-
            PRD_Mobull_Fuel_Gauge_Accuracy_Rework.md FR-2/§9.4 (Phase 1). Null for any
            booking never re-saved through the Places-autocomplete address field
            (including every booking that existed before this field shipped) — the
            Fuel Gauge treats that as Unknown, never a guess.
        longitude:
          type: number
          nullable: true
        googlePlaceId:
          type: string
          nullable: true
        formattedAddress:
          type: string
          nullable: true
          description: Google's normalized address string for `latitude`/`longitude`, distinct from the free-typed `address`.
        depositAmount:
          type: number
        parkingCost:
          type: number
        status:
          type: string
          enum: [confirmed, pending, completed, cancelled, no-show]
        notes:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
          enum: [zelle, venmo, cash, credit_card]
        paymentReference:
          type: string
          nullable: true
        paymentRecordedAt:
          type: string
          format: date-time
          nullable: true
        refundStatus:
          type: string
          nullable: true
          enum: [none, requested, completed]
        refundReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: id of the admin/owner user who created this booking.
      required:
        - id
        - clientId
        - packageIds
        - employeeIds
        - employeeSplit
        - date
        - startTime
        - address
        - latitude
        - longitude
        - googlePlaceId
        - formattedAddress
        - depositAmount
        - parkingCost
        - status
        - createdAt
        - updatedAt
        - createdBy
    CreateBookingRequest:
