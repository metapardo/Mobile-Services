openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin/owner authentication and fully self-serve signup
  - name: settings
    description: Per-organization business settings (home base address, Gas Meter/payroll defaults)
  - name: clients
    description: Customer/client records
  - name: packages
    description: Service packages/add-ons offered
  - name: employees
    description: >-
      Employee records, including the Payroll Module's pay profile (worker type,
      payment method, bank accounts on file)
  - name: bookings
    description: Scheduled jobs, including their assigned packages, employee revenue splits, and recorded payment/refund
  - name: payroll
    description: >-
      Employee roles/pay rates, time tracking, time off, and payroll runs
      (docs/prds/PRD_DetailHub_Payroll_Module.md)
  - name: reports
    description: >-
      The Reports section's Monthly/Quarterly/Annual "Financial View" — income
      statement, balance sheet, cash flow, package mix, and revenue-by-employee
      (PRD_DetailHub_After_Package_Work.md Section 6.2)
  - name: maps
    description: >-
      Server-side proxies to Google Maps Platform (Places API (New), Routes API) for
      the Fuel Gauge accuracy rework (PRD_Mobull_Fuel_Gauge_Accuracy_Rework.md Section
      9.1). `GOOGLE_MAPS_API_KEY` is read only in `artifacts/api-server` and never
      reaches the browser.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Fully self-serve admin/owner signup
      description: >-
        Creates a new admin/owner user account and a brand-new organization together,
        with no invite token or gate of any kind
        (`PRD_DetailHub_SelfServe_Signup_Trial.md` FR-1/FR-2) — collects name, email,
        password, business name, and a required business address (FR-3, FR-11), which
        populates the new organization's `settings.homeAddress` (the same field the
        Gas Meter feature depends on; not a duplicate address field). No card is
        collected here (Phase B/Stripe scope, not this endpoint). On success, this
        endpoint also signs the caller in (sets the session cookie, same as
        `POST /auth/login`) and activates the newly-created organization on that
        session — the response includes `token`/`organizationId` for the same reason
        `LoginResult` does, so the frontend can land the user directly inside the app
        with no separate login step and no email-verification gate (FR-5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account and organization created; caller is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResult"
        "400":
          description: >-
            Invalid request body, or the organization slug/name is already taken
            (`error` carries a machine-readable code, e.g.
            `ORGANIZATION_SLUG_ALREADY_TAKEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Account or organization creation failed, e.g. the email is already
            registered (`error` carries a machine-readable code, e.g.
            `USER_ALREADY_EXISTS_USE_ANOTHER_EMAIL`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin/owner sign-in
      description: >-
        Signs in an existing admin/owner user with email + password. On success, sets a
        session cookie on the response (`Set-Cookie`, `httpOnly`) — the browser stores
        and resends it automatically on subsequent same-origin/allowed-cross-origin
        requests; callers don't read or manage it directly. The response body also
        echoes the raw session `token` for non-cookie clients (e.g. a future
        React Native/Expo client using `Authorization: Bearer <token>` instead of
        cookies — see `lib/api-client-react`'s `setAuthTokenGetter`).

        If this user belongs to exactly one organization (the expected case for v1 —
        one admin/owner per organization, no multi-org membership yet), that
        organization is automatically set as the session's active organization, so the
        immediately-following `GET /auth/session` reports a usable `organizationId`
        without a separate "pick your organization" step. If the user belongs to zero
        or more than one organization, no active organization is set and
        `organizationId` comes back `null` — see `GET /auth/session` for how that state
        is surfaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; session cookie set on the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: Invalid request body (`error` e.g. `invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            Invalid email or password (`error` is `INVALID_EMAIL_OR_PASSWORD`; the
            response deliberately does not distinguish "no such user" from "wrong
            password").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out the current session
      description: >-
        Reads the session cookie (if any) from the request and invalidates that session
        server-side (the underlying `session` table row is deleted, not merely
        expired/left dangling), then sets an expired `Set-Cookie` on the response so the
        browser drops it too. Always responds `200`, including when the request carried
        no session or an already-invalid one — "nothing to log out of" is a normal,
        expected outcome here, not an error (same convention as `GET /auth/session`
        always responding `200` for "not signed in").
      responses:
        "200":
          description: >-
            Session invalidated (or there was none to invalidate) and the session cookie
            was cleared on the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Check the current session
      description: >-
        Reads the session cookie (if any) from the request and reports whether it's
        valid, and — if valid — whether it has an active organization. Always responds
        `200`; "not signed in" is a normal, expected response shape here, not an error
        (distinct from endpoints that require auth and should 401 instead). Three
        possible states, distinguished so the frontend can render the right thing
        (redirect to login vs. "sign-in is fine, but your account isn't in an
        organization yet — contact support" — the latter should be rare in v1, since
        `POST /auth/login` auto-sets the active organization for the expected
        exactly-one-organization case, but isn't impossible, e.g. an organization that
        was deleted out from under an existing session):
          1. No valid session at all: `{ "authenticated": false }`.
          2. Valid session, active organization set: `{ "authenticated": true, "user":
             {...}, "organizationId": "<id>" }`.
          3. Valid session, no active organization: `{ "authenticated": true, "user":
             {...}, "organizationId": null }`.
      responses:
        "200":
          description: >-
            Session status. Always 200 — see the state breakdown above; check
            `authenticated` (and `organizationId`, when `authenticated` is true) rather
            than the HTTP status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get the current organization's settings
      description: >-
        Requires an authenticated session with an active organization (session
        cookie). Returns the single settings row for that organization — created
        automatically at signup (`POST /auth/signup`) with the business address
        supplied there and sensible defaults for everything else (Gas Meter
        thresholds, commission rate, payment-processor flags); see
        `PRD_DetailHub_SelfServe_Signup_Trial.md` FR-11/FR-13.
      responses:
        "200":
          description: The organization's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No settings row exists for this organization yet (should not happen for an
            organization created via `POST /auth/signup`, which always creates one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update the current organization's settings
      description: >-
        Requires an authenticated session with an active organization (session
        cookie). Partial update — any subset of fields may be sent; omitted fields are
        left unchanged. The primary use case for now is editing the business address
        later (`homeAddress`, FR-13), but every settings field is editable through this
        same endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No settings row exists for this organization yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the current organization's clients
      description: >-
        Requires an authenticated session with an active organization. Excludes
        archived (soft-deleted) clients by default — pass `includeArchived=true` to
        include them too (e.g. a client-detail page reached from an old booking).
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The organization's clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      description: Requires an authenticated session with an active organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "201":
          description: Client created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      description: Partial update — any subset of fields may be sent; omitted fields are left unchanged.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "200":
          description: Updated client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: archiveClient
      tags: [clients]
      summary: Archive (soft-delete) a client
      description: >-
        Marks the client archived rather than removing the row, so any booking that
        already references it keeps a valid `clientId`
        (`PRD_DetailHub_Real_Bookings_Clients_Backend.md` Section 10/Edge Cases). The
        archived client no longer appears in `GET /clients` unless
        `includeArchived=true` is passed.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List the current organization's packages
      description: >-
        Excludes archived (soft-deleted) packages by default — pass
        `includeArchived=true` to include retired packages still referenced by
        historical bookings.
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The organization's packages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageResult"
        "401":
