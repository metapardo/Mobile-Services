        netIncome:
          type: number
        depreciation:
          type: number
        changeReceivables:
          type: number
        changePayables:
          type: number
        cashFromOperations:
          type: number
        loanPayments:
          type: number
        ownerDraws:
          type: number
        cashFromFinancing:
          type: number
        netChange:
          type: number
        cashBeginning:
          type: number
        cashEnding:
          type: number
      required:
        - netIncome
        - depreciation
        - changeReceivables
        - changePayables
        - cashFromOperations
        - loanPayments
        - ownerDraws
        - cashFromFinancing
        - netChange
        - cashBeginning
        - cashEnding
    FinancialReportResult:
      type: object
      description: >-
        Response of `GET /reports/financials`. See that path's own description, and
        `calculateFinancialReport` in `@workspace/db`'s `reports.ts`, for the exact
        real-data-vs-fixed-constant breakdown of every field below.
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        months:
          type: array
          description: Every "YYYY-MM" spanned by the requested period, inclusive.
          items:
            type: string
        revenue:
          type: number
          description: Real — completed bookings in the period x their assigned packages' current price.
        jobs:
          type: integer
          description: Real — count of completed bookings in the period.
        avgTicket:
          type: number
          description: "Real. Guarded against division by zero (FR-13): 0 when jobs is 0."
        cogs:
          type: object
          properties:
            labor:
              type: number
              description: Real — total gross payroll for the period (`calculatePayrollSummary`'s `grossTotal`).
            materials:
              type: number
              description: "Fixed rate (7.96%) applied to real revenue."
            gas:
              type: number
              description: "Fixed rate ($11.833/job) applied to real jobs."
            total:
              type: number
          required: [labor, materials, gas, total]
        grossProfit:
          type: number
        grossMarginPct:
          type: number
          description: "Guarded against division by zero (FR-13): 0 when revenue is 0."
        opex:
          type: object
          description: >-
            Fixed monthly overhead constants (insurance/vehicleMaint/software/
            marketing/adminWages), scaled by the number of calendar months `months`
            spans. No real overhead tracking exists yet.
          properties:
            insurance:
              type: number
            vehicleMaint:
              type: number
            software:
              type: number
            marketing:
              type: number
            adminWages:
              type: number
            total:
              type: number
          required: [insurance, vehicleMaint, software, marketing, adminWages, total]
        operatingIncome:
          type: number
        operatingMarginPct:
          type: number
          description: "Guarded against division by zero (FR-13): 0 when revenue is 0."
        interest:
          type: number
          description: Fixed ($140/mo, scaled by months spanned) — loan interest.
        preTaxIncome:
          type: number
        tax:
          type: number
          description: Fixed illustrative 25% rate applied to real (max(0, ...)) pre-tax income.
        netIncome:
          type: number
        netMarginPct:
          type: number
          description: "Guarded against division by zero (FR-13): 0 when revenue is 0."
        depreciation:
          type: object
          description: Fixed monthly depreciation constants, scaled by months spanned. Non-cash.
          properties:
            vehicle:
              type: number
            equipment:
              type: number
            total:
              type: number
          required: [vehicle, equipment, total]
        packageMix:
          type: array
          items:
            $ref: "#/components/schemas/PackageMixEntry"
        revenueByEmployee:
          type: array
          items:
            $ref: "#/components/schemas/RevenueByEmployeeEntry"
        balanceSheet:
          $ref: "#/components/schemas/FinancialReportBalanceSheet"
        cashFlow:
          $ref: "#/components/schemas/FinancialReportCashFlow"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/FinancialReportTrendPoint"
      required:
        - periodStart
        - periodEnd
        - months
        - revenue
        - jobs
        - avgTicket
        - cogs
        - grossProfit
        - grossMarginPct
        - opex
        - operatingIncome
        - operatingMarginPct
        - interest
        - preTaxIncome
        - tax
        - netIncome
        - netMarginPct
        - depreciation
        - packageMix
        - revenueByEmployee
        - balanceSheet
        - cashFlow
        - trend
    AutocompletePlacesRequest:
      type: object
      description: >-
        `originLat`/`originLng` are optional for now — Home Base coordinates don't
        exist in the DB yet (a later phase's job); when omitted, `locationBias` is
        left off the upstream Google request entirely rather than erroring.
      properties:
        input:
          type: string
          minLength: 1
        sessionToken:
          type: string
          minLength: 1
          description: >-
            One token per address-entry session (FR-11), reused across every
            Autocomplete call and the terminating Place Details call in that session.
        originLat:
          type: number
        originLng:
          type: number
      required:
        - input
        - sessionToken
    AutocompletePlacesResult:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/PlaceSuggestion"
      required:
        - suggestions
    PlaceSuggestion:
      type: object
      properties:
        placeId:
          type: string
        text:
          type: string
          description: 'Full suggestion text, e.g. "1102 Flatbush Ave, Brooklyn, NY, USA".'
        matches:
          type: array
          description: >-
            Matched-substring offsets (FR-13), so the frontend can bold what the owner
            typed within `text`.
          items:
            $ref: "#/components/schemas/PlaceSuggestionMatch"
      required:
        - placeId
        - text
        - matches
    PlaceSuggestionMatch:
      type: object
      properties:
        startOffset:
          type: integer
        endOffset:
          type: integer
      required:
        - startOffset
        - endOffset
    GetPlaceDetailsRequest:
      type: object
      properties:
        placeId:
          type: string
          minLength: 1
        sessionToken:
          type: string
          minLength: 1
          description: >-
            The same token used for the preceding `/places/autocomplete` calls in this
            address-entry session; passing it here closes that billing session (FR-11).
      required:
        - placeId
        - sessionToken
    PlaceDetailsResult:
      type: object
      properties:
        placeId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        formattedAddress:
          type: string
      required:
        - placeId
        - latitude
        - longitude
        - formattedAddress
    ComputeRouteRequest:
      type: object
      properties:
        originPlaceId:
          type: string
          minLength: 1
        destinationPlaceId:
          type: string
          minLength: 1
        departureTime:
          type: string
          format: date-time
          description: The appointment's scheduled start (FR-3), ISO 8601.
      required:
        - originPlaceId
        - destinationPlaceId
        - departureTime
    ComputeRouteResult:
      type: object
      description: >-
        One-way distance/time — callers double it themselves for the round trip
        (PRD §6.1).
      properties:
        miles:
          type: number
        minutes:
          type: number
      required:
        - miles
        - minutes
    ComputeRouteMatrixRequest:
      type: object
      description: >-
        PRD_Mobull_Appointment_Optimizer_v1.0.md FR-18a/FR-20. One origin, many
        destinations, one Route Matrix batch per search — never N separate
        `/routes/compute` calls in a loop. `destinationPlaceIds.maxItems: 25` is a
        starting guess pending confirmation against Google's live Route Matrix v2
        batch-size limits (verify before the real integration lands — do not assume
        this number is Google-confirmed).
      properties:
        originPlaceId:
          type: string
          minLength: 1
        destinationPlaceIds:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
        departureTime:
          type: string
          format: date-time
          description: The new appointment's candidate start time, ISO 8601.
      required:
        - originPlaceId
        - destinationPlaceIds
        - departureTime
    RouteMatrixElementResult:
      type: object
      description: >-
        One result per requested destination place id. PRD §10: "Route Matrix
        partially fails -> drop failed candidates, rank the rest" — `error` is
        non-null (and `miles`/`minutes` are both null) for exactly the destinations
        that failed, without failing the whole request.
      properties:
        destinationPlaceId:
          type: string
        miles:
          type: number
          nullable: true
        minutes:
          type: number
          nullable: true
        error:
          type: string
          nullable: true
          description: Null on success; a machine-readable reason string when this element failed.
      required:
        - destinationPlaceId
        - miles
        - minutes
        - error
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable detail, when available.
      required:
        - error

