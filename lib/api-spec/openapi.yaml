      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePackageRequest"
      responses:
        "200":
          description: Updated package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResult"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
