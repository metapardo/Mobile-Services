        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No package with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: archivePackage
      tags: [packages]
      summary: Archive (soft-delete) a package
      description: >-
        Marks the package archived rather than removing the row, so any booking that
        already references it keeps a valid `packageId`. The archived package no
