        "404":
          description: No employee with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings, optionally within a date range and/or for one client
      description: >-
        Powers the calendar view (FR-10) — `start`/`end` (both `YYYY-MM-DD`, both
        optional, inclusive) filter on `date` rather than fetching every booking ever
        made. Omitting both returns every booking for the organization. `clientId`
        (Section 6.2 of PRD_DetailHub_Signup_Copy_and_Packages_Hardening.md) further
        narrows the result to bookings for that client — it composes with (never
        replaces) the organization scope every request is already limited to, so a
        `clientId` belonging to a different organization returns an empty array
        rather than another organization's booking.
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching bookings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      description: >-
        `packageIds` and `employeeSplit` fully describe the booking's line items and
        employee revenue split in one call (a `booking_packages`/`employee_splits`
        join row is written per entry). `employeeSplit` may be empty (a booking can be
        created before an employee is assigned), but if non-empty every percentage
        must be in `(0, 100]` and the set must sum to exactly 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"
        "400":
          description: >-
            Invalid request body, an invalid `employeeSplit` (see this operation's
            description), or a `clientId`/`packageIds`/`employeeSplit[].employeeId`
            that doesn't reference a real row in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      description: >-
        Partial update. Omitting `packageIds`/`employeeSplit` leaves them unchanged;
        passing either replaces the entire set (not a merge). Same `employeeSplit`
        validation as `POST /bookings`.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResult"
        "400":
          description: Invalid request body, an invalid `employeeSplit`, or a dangling reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      description: >-
        Hard delete (unlike clients/packages/employees) — nothing else references a
        booking except its own `booking_packages`/`employee_splits` rows, which cascade.
        Prefer `PATCH /bookings/{id}` with `status: cancelled` for a normal
        cancellation; this is for genuine removal.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Booking deleted.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed in, but the session has no active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No booking with this id exists in the current organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignupRequest:
      type: object
      description: >-
        Body for the fully self-serve admin/owner signup endpoint. Creates one user
        and one brand-new organization together — no invite token.
      properties:
        name:
          type: string
          minLength: 1
          description: The admin/owner user's display name.
        email:
          type: string
          format: email
          description: The admin/owner user's login email.
        password:
          type: string
          minLength: 8
          description: The admin/owner user's password (min length matches Better Auth's default).
        organizationName:
          type: string
          minLength: 1
          description: Display name of the new organization.
        organizationSlug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: URL-safe unique slug for the new organization (lowercase, hyphen-separated).
        businessAddress:
          type: string
          minLength: 1
          description: >-
            The business's home base address, required at signup
            (`PRD_DetailHub_SelfServe_Signup_Trial.md` FR-3/FR-11). Stored verbatim as
            `settings.homeAddress` for the new organization — not geocoded at signup
            time (FR-12); a future geocoding job is out of scope here.
      required:
        - name
        - email
        - password
        - organizationName
        - organizationSlug
        - businessAddress
    AuthUser:
      type: object
      description: >-
        The authenticated admin/owner user, as returned by every auth endpoint that
        includes a user (signup, login, session-check) — one shape shared across all
        three so the frontend has a single `AuthUser` type to work with.
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - emailVerified
        - createdAt
    SignupOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - createdAt
    SignupResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        organization:
          $ref: "#/components/schemas/SignupOrganization"
        token:
          type: string
          description: >-
            The raw session token, for non-cookie clients — mirrors
            `LoginResult.token`. Present because signup now also signs the caller in
            (see this operation's description).
        organizationId:
          type: string
          description: >-
            The newly-created organization's id, set as this session's active
            organization. Unlike `LoginResult.organizationId`, this is never `null` —
            signup always activates the organization it just created.
      required:
        - user
        - organization
        - token
        - organizationId
    LoginRequest:
      type: object
      description: Body for admin/owner sign-in.
      properties:
        email:
          type: string
          format: email
          description: The admin/owner user's login email.
        password:
          type: string
          minLength: 1
          description: The admin/owner user's password.
      required:
        - email
        - password
    LoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        token:
          type: string
          description: >-
            The raw session token, for non-cookie clients (bearer-token auth). Browser
            clients don't need this — the session cookie is set on the response
            automatically and is what the browser actually uses.
        organizationId:
          type: string
          nullable: true
          description: >-
            The organization automatically set as this session's active organization
            (see the `/auth/login` description for when that happens), or `null` if it
            wasn't — mirrors `SessionResult.organizationId` so the frontend doesn't have
            to make a separate `GET /auth/session` call immediately after login just to
            learn this.
      required:
        - user
        - token
        - organizationId
    SessionResult:
      type: object
      description: >-
        Discriminated on `authenticated`: when `false`, `user`/`organizationId` are
        absent (not merely null) — the frontend should check `authenticated` first.
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
        organizationId:
          type: string
          nullable: true
          description: >-
            Only present when `authenticated` is true. `null` means the session is
            valid but has no active organization set (see `/auth/session`'s
            description for when this can happen) — distinct from `authenticated:
            false`, which means there's no valid session at all.
      required:
        - authenticated
    LogoutResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    SettingsResult:
      type: object
      description: >-
        Per-organization settings — one row per organization, created automatically at
        signup. Field names/shape match `artifacts/detail-hub/src/lib/mock-data.ts`'s
        `Settings` interface (see `PRD_MobileDetailingApp.md` Section 3.2's Gas Meter
        feature for what most of these beyond `homeAddress` are used for).
      properties:
        homeAddress:
          type: string
          description: >-
            The business's home base address (`AdminSettings.home_base_address` in the
            master PRD). Editable via `PATCH /settings`.
        gasPrice:
          type: number
          description: Assumed $/gallon fuel price, for Gas Meter cost estimates.
        vehicleMpg:
          type: number
          description: Assumed vehicle fuel economy, for Gas Meter cost estimates.
        gasThresholdGreen:
          type: number
          description: Gas Meter "green" cost-ratio threshold (percent).
        gasThresholdAmber:
          type: number
          description: Gas Meter "amber" cost-ratio threshold (percent).
        commissionRate:
          type: number
          description: Default employee commission rate (percent), used by Payroll.
        fuelGaugeHalfMi:
          type: number
          description: Fuel Gauge "half" band lower bound, $/mile.
        fuelGaugeFullMi:
          type: number
          description: Fuel Gauge "full" band lower bound, $/mile.
        fuelGaugeHalfMin:
          type: number
          description: Fuel Gauge "half" band lower bound, $/minute.
        fuelGaugeFullMin:
          type: number
          description: Fuel Gauge "full" band lower bound, $/minute.
        paymentProcessorConnected:
          type: boolean
        cardReaderPaired:
          type: boolean
      required:
        - homeAddress
        - gasPrice
        - vehicleMpg
        - gasThresholdGreen
        - gasThresholdAmber
        - commissionRate
        - fuelGaugeHalfMi
        - fuelGaugeFullMi
        - fuelGaugeHalfMin
        - fuelGaugeFullMin
        - paymentProcessorConnected
        - cardReaderPaired
    UpdateSettingsRequest:
      type: object
      description: >-
        Partial update to the current organization's settings. All fields optional —
        omitted fields are left unchanged. Same field set as `SettingsResult`.
      properties:
        homeAddress:
          type: string
          minLength: 1
        gasPrice:
          type: number
        vehicleMpg:
          type: number
        gasThresholdGreen:
          type: number
        gasThresholdAmber:
          type: number
        commissionRate:
          type: number
        fuelGaugeHalfMi:
          type: number
        fuelGaugeFullMi:
          type: number
        fuelGaugeHalfMin:
          type: number
        fuelGaugeFullMin:
          type: number
        paymentProcessorConnected:
          type: boolean
        cardReaderPaired:
          type: boolean
    ClientResult:
      type: object
      description: >-
        A customer/client record. Field names/shape match
        `artifacts/detail-hub/src/lib/mock-data.ts`'s `Client` interface, plus
        `archived`/`createdAt`/`updatedAt` (formalized here, not present on the mock
        interface).
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        notes:
          type: string
          nullable: true
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - email
        - address
        - archived
        - createdAt
        - updatedAt
    CreateClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        address:
          type: string
          minLength: 1
        notes:
          type: string
          nullable: true
      required:
        - name
        - phone
        - email
        - address
    UpdateClientRequest:
      type: object
      description: Partial update — all fields optional.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        address:
          type: string
          minLength: 1
        notes:
          type: string
          nullable: true
    PackageResult:
      type: object
      description: >-
        A service package/add-on. Field names/shape match
        `artifacts/detail-hub/src/lib/mock-data.ts`'s `Package` interface (including
        `durationMinutes`, not `durationEstimate` — the mock interface is the source of
        truth per `PRD_DetailHub_Real_Bookings_Clients_Backend.md` Section 7), plus
        `createdAt`/`updatedAt`.
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [Exterior, Interior, Full, Add-on]
        description:
          type: string
        price:
          type: number
        durationMinutes:
          type: integer
        isAddon:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - description
        - price
        - durationMinutes
        - isAddon
        - archived
        - createdAt
        - updatedAt
    CreatePackageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          enum: [Exterior, Interior, Full, Add-on]
        description:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        durationMinutes:
          type: integer
          minimum: 1
        isAddon:
          type: boolean
      required:
        - name
        - category
        - description
        - price
        - durationMinutes
        - isAddon
    UpdatePackageRequest:
      type: object
      description: Partial update — all fields optional.
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          enum: [Exterior, Interior, Full, Add-on]
        description:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        durationMinutes:
          type: integer
          minimum: 1
        isAddon:
          type: boolean
    EmployeeResult:
      type: object
      description: >-
        Minimal employee record — `id`/`name`/`color` match
        `artifacts/detail-hub/src/lib/mock-data.ts`'s `Employee` interface exactly;
        `active`/`email`/`phone`/`createdAt`/`updatedAt` are formalized additions. Does
        NOT expose the full payroll profile (worker type, pay rate, bank accounts) that
        already exists at the DB layer for the Payroll Module — out of scope for this
        API surface per FR-2.
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - active
        - createdAt
        - updatedAt
    CreateEmployeeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        active:
          type: boolean
      required:
        - name
        - color
    UpdateEmployeeRequest:
      type: object
      description: Partial update — all fields optional.
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        active:
          type: boolean
    EmployeeSplit:
      type: object
      description: >-
        Matches `artifacts/detail-hub/src/lib/mock-data.ts`'s `EmployeeSplit`
        interface. `Booking.employeeIds` is folded into this (see `BookingResult`) —
        the split's `employeeId` list already implies assignment, so a separate raw
        id list would just be redundant data that could drift.
      properties:
        employeeId:
          type: integer
        percentage:
          type: number
          minimum: 0
          maximum: 100
      required:
        - employeeId
        - percentage
    BookingResult:
      type: object
      description: >-
        Field names/shape match `artifacts/detail-hub/src/lib/mock-data.ts`'s
        `Booking` interface (`date`, `startTime`, `address`, not the master PRD's
        `scheduledDate`/`scheduledStartTime`/`serviceAddress` — the mock interface is
        the source of truth per Section 7), plus `createdAt`/`updatedAt`/`createdBy`.
        `employeeIds` is derived from `employeeSplit` for convenience, not stored
        separately. (`gasMeterStatus`/`weatherSnapshot` were removed per FR-9 of
        PRD_DetailHub_Signup_Copy_and_Packages_Hardening.md — dead placeholder
        columns never populated by a real integration; FR-11 says they come back for
        real later, see Fuel_Gauge_PRD.md.)
      properties:
        id:
          type: integer
        clientId:
          type: integer
        packageIds:
          type: array
          items:
            type: integer
        employeeIds:
          type: array
          items:
            type: integer
          description: Derived from `employeeSplit` (every `employeeId` present in the split).
        employeeSplit:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSplit"
        date:
          type: string
          format: date
        startTime:
          type: string
          description: "24-hour HH:MM, e.g. \"09:00\"."
        address:
          type: string
        depositAmount:
          type: number
        parkingCost:
          type: number
        status:
          type: string
          enum: [confirmed, pending, completed, cancelled, no-show]
        notes:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
          enum: [cash, zelle, venmo, card, tap]
        paymentNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: id of the admin/owner user who created this booking.
      required:
        - id
        - clientId
        - packageIds
        - employeeIds
        - employeeSplit
        - date
        - startTime
        - address
        - depositAmount
        - parkingCost
        - status
        - createdAt
        - updatedAt
        - createdBy
    CreateBookingRequest:
      type: object
      properties:
        clientId:
          type: integer
        packageIds:
          type: array
          items:
            type: integer
          default: []
        employeeSplit:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSplit"
          default: []
        date:
          type: string
          format: date
        startTime:
          type: string
        address:
          type: string
          minLength: 1
        depositAmount:
          type: number
          minimum: 0
        parkingCost:
          type: number
          minimum: 0
        status:
          type: string
          enum: [confirmed, pending, completed, cancelled, no-show]
        notes:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
          enum: [cash, zelle, venmo, card, tap]
        paymentNote:
          type: string
          nullable: true
      required:
        - clientId
        - date
        - startTime
        - address
        - depositAmount
        - parkingCost
        - status
    UpdateBookingRequest:
      type: object
      description: >-
        Partial update — all fields optional. Omitting `packageIds`/`employeeSplit`
        leaves them unchanged; passing either replaces the entire set.
      properties:
        clientId:
          type: integer
        packageIds:
          type: array
          items:
            type: integer
        employeeSplit:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSplit"
        date:
          type: string
          format: date
        startTime:
          type: string
        address:
          type: string
          minLength: 1
        depositAmount:
          type: number
          minimum: 0
        parkingCost:
          type: number
          minimum: 0
        status:
          type: string
          enum: [confirmed, pending, completed, cancelled, no-show]
        notes:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
          enum: [cash, zelle, venmo, card, tap]
        paymentNote:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable detail, when available.
      required:
        - error

